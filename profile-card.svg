
<svg width="850" height="450" viewBox="0 0 850 450" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->

  <defs>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">

      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>

    </filter>

    <style>

      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap');

      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', 'Courier New', monospace; }

    </style>

  </defs>



  <!-- Outer Window Container -->

  <rect x="15" y="15" width="820" height="420" rx="12" ry="12" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1" filter="url(#shadow)"/>



  <!-- Window Header Bar -->

  <rect x="15" y="15" width="820" height="35" rx="12" ry="12" fill="#e6eaef" stroke="#d0d7de" stroke-width="1"/>



  <!-- macOS Window Controls -->

  <circle cx="35" cy="32" r="6" fill="#ed6158"/>

  <circle cx="57" cy="32" r="6" fill="#fcc02e"/>

  <circle cx="79" cy="32" r="6" fill="#5fc038"/>



  <!-- Header Text -->

  <text x="425" y="33" class="mono" font-size="13" font-weight="500" text-anchor="middle" fill="#24292e">profile.sh --live</text>



  <!-- Live Badge -->

  <circle cx="800" cy="32" r="4" fill="#28a745"/>

  <text x="815" y="37" class="mono" font-size="11" font-weight="500" fill="#28a745">LIVE</text>



  <!-- Animated pulse for live dot -->

  <circle cx="800" cy="32" r="4" fill="#28a745" opacity="0.8">

    <animate attributeName="r" values="4;7" dur="1.5s" repeatCount="indefinite"/>

    <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite"/>

  </circle>



  <!-- Left Column: VISUAL.MAP -->

  <text x="30" y="75" class="mono" font-size="12" font-weight="500" fill="#24292e">VISUAL.MAP</text>

  <line x1="30" y1="82" x2="150" y2="82" stroke="#d0d7de" stroke-width="1"/>



  <!-- Avatar Placeholder Pixelated Frame -->

  <rect x="40" y="95" width="120" height="120" rx="4" fill="#f0f1f3" stroke="#b0bcc4" stroke-width="2"/>

  

  <!-- Pixelated Avatar Pattern -->

  <g opacity="0.7">

    <rect x="50" y="105" width="12" height="12" fill="#4a5568"/>

    <rect x="62" y="105" width="12" height="12" fill="#4a5568"/>

    <rect x="98" y="105" width="12" height="12" fill="#4a5568"/>

    <rect x="110" y="105" width="12" height="12" fill="#4a5568"/>

    

    <rect x="50" y="125" width="12" height="12" fill="#4a5568"/>

    <rect x="110" y="125" width="12" height="12" fill="#4a5568"/>

    

    <rect x="45" y="145" width="40" height="8" fill="#4a5568"/>

    <rect x="95" y="145" width="25" height="8" fill="#4a5568"/>

    

    <rect x="50" y="160" width="70" height="10" fill="#2d3748"/>

  </g>



  <!-- Right Column: SYSTEM.INFO -->

  <text x="180" y="75" class="mono" font-size="12" font-weight="500" fill="#24292e">SYSTEM.INFO</text>

  <line x1="180" y1="82" x2="835" y2="82" stroke="#d0d7de" stroke-width="1"/>



  <!-- System Info Content -->

  <text x="190" y="110" class="mono" font-size="11" fill="#24292e">

    <tspan x="190" dy="0">subject............Neversplit2</tspan>

    <tspan x="190" dy="18">role................Data Science Dev</tspan>

    <tspan x="190" dy="18">origin.............Global</tspan>

    <tspan x="190" dy="18">core.lang..........Python | JS | Notebook</tspan>

    <tspan x="190" dy="18">core.frontend......JavaScript, HTML, CSS</tspan>

    <tspan x="190" dy="18">core.backend.......Python, Jupyter</tspan>

    <tspan x="190" dy="18">core.database......Data Science Stack</tspan>

    <tspan x="190" dy="18">core.infra.........Shell, Git</tspan>

    <tspan x="190" dy="18">grid.github........github.com/Neversplit2</tspan>

  </text>



  <!-- Bottom Accent Line -->

  <line x1="15" y1="430" x2="835" y2="430" stroke="#d0d7de" stroke-width="1"/>



  <!-- Footer Status -->

  <text x="30" y="445" class="mono" font-size="10" fill="#6e7781">[neversplit2@terminal ~]$</text>

</svg>
